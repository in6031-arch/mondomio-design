<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소개 및 문의 | MONDOMIO DESIGN</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/sample.jpg" alt="MONDOMIO DESIGN">
      </a>
      <nav class="main-nav">
        <a href="/">포트폴리오</a>
        <a href="/about.html" class="active">소개 및 문의</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Project Inquiry &amp; Guestbook</h1>
      <p>건축 및 인테리어 디자인 의뢰나 궁금한 점을 남겨주시면 MONDOMIO DESIGN 팀이 빠르게 답변해 드립니다.</p>
    </div>
  </section>

  <main class="container contact-section">
    <div class="inquiry-box">
      <h2 class="section-title">문의 및 방명록 남기기</h2>
      <form id="memoForm">
        <div class="form-group">
          <label for="username">성함 / 업체명</label>
          <input type="text" id="username" placeholder="예: 홍길동 / (주)몬도미오" required>
        </div>
        <div class="form-group">
          <label for="memo">문의 내용 또는 방명록</label>
          <textarea id="memo" rows="4" placeholder="공간 유형, 위치, 예상 면적이나 궁금하신 내용을 자유롭게 남겨주세요." required></textarea>
        </div>
        <button type="submit" class="btn-submit">문의 등록하기</button>
      </form>
    </div>

    <div class="memo-list-wrapper">
      <h3 class="list-subtitle">등록된 문의 및 방명록</h3>
      <div id="memoList" class="memo-list">
        <p class="empty-msg">불러오는 중...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 MONDOMIO DESIGN. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const memoForm = document.getElementById('memoForm');
    const memoList = document.getElementById('memoList');

    // 목록 불러오기
    async function loadMemos() {
      try {
        const res = await fetch('/memos');
        const memos = await res.json();

        if (!Array.isArray(memos) || memos.length === 0) {
          memoList.innerHTML = '<p class="empty-msg">아직 등록된 문의가 없습니다. 첫 번째 글을 남겨보세요!</p>';
          return;
        }

        memoList.innerHTML = memos.map(item => `
          <div class="memo-item">
            <div class="memo-header">
              <strong class="memo-author">${escapeHtml(item.username)}</strong>
              <div class="memo-meta">
                <span class="memo-time">${escapeHtml(item.time || '')}</span>
                <button type="button" class="btn-delete" onclick="deleteMemo(${item.id})">삭제</button>
              </div>
            </div>
            <p class="memo-content">${escapeHtml(item.memo).replace(/\n/g, '<br>')}</p>
          </div>
        `).join('');
      } catch (err) {
        memoList.innerHTML = '<p class="empty-msg">목록을 불러오지 못했습니다.</p>';
      }
    }

    // 새 문의 등록하기
    memoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const memo = document.getElementById('memo').value.trim();

      if (!username || !memo) return;

      try {
        const res = await fetch('/memos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, memo })
        });

        if (res.ok) {
          memoForm.reset();
          loadMemos();
        } else {
          alert('등록 중 오류가 발생했습니다.');
        }
      } catch (err) {
        alert('서버 연결에 실패했습니다.');
      }
    });

    // 관리자 비밀번호 인증 후 삭제하기
    async function deleteMemo(id) {
      const password = prompt('관리자 비밀번호를 입력하세요:');
      if (password === null) return;

      if (!password.trim()) {
        alert('비밀번호를 입력해 주세요.');
        return;
      }

      try {
        const res = await fetch(`/memos/${id}`, {
          method: 'DELETE',
          headers: {
            'x-admin-password': password
          }
        });

        const result = await res.json();

        if (res.ok) {
          alert('삭제되었습니다.');
          loadMemos();
        } else {
          alert(result.error || '삭제 권한이 없습니다.');
        }
      } catch (err) {
        alert('서버 통신 중 오류가 발생했습니다.');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    loadMemos();
  </script>
</body>
</html>
