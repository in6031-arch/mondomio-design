<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>소개 및 문의 | MONDOMIO DESIGN</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo-box">
      <a href="/index.html"><img src="/sample.jpg" alt="MONDOMIO DESIGN"></a>
    </div>
    <nav>
      <a href="/index.html">포트폴리오</a>
      <a href="/about.html" class="active">소개 및 문의</a>
    </nav>
  </header>

  <main class="container">
    <div class="contact-box">
      <div style="text-align: center; margin-bottom: 30px;">
        <img src="/sample.jpg" alt="MONDOMIO DESIGN" style="width: 160px; border-radius: 8px; margin-bottom: 16px;">
        <h2 style="color: #1b2a4a; margin-bottom: 8px;">Project Inquiry & Guestbook</h2>
        <p style="color: #64748b; font-size: 14px;">디자인 의뢰나 궁금한 점을 남겨주시면 빠르게 답변해 드립니다.</p>
      </div>

      <!-- 실시간 문의/방명록 입력 폼 -->
      <div class="form-row">
        <input type="text" id="username" placeholder="성함 / 업체명" style="width: 140px;">
        <input type="text" id="memo" placeholder="문의 내용이나 방명록을 남겨주세요" style="flex: 1;">
        <button onclick="addMemo()" class="btn-dark">남기기</button>
      </div>

      <!-- 등록된 글 목록 -->
      <ul id="memo-list" style="list-style: none; max-height: 300px; overflow-y: auto;"></ul>
    </div>
  </main>

  <footer>
    © 2026 MONDOMIO DESIGN. All rights reserved.
  </footer>

  <script>
    async function loadMemos() {
      const res = await fetch('/memos');
      const memos = await res.json();
      const list = document.getElementById('memo-list');
      
      if (memos.length === 0) {
        list.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:20px;">아직 등록된 문의가 없습니다. 첫 번째 글을 남겨보세요!</li>';
        return;
      }

      list.innerHTML = memos.map(item => `
        <li style="background: #f8fafc; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <strong style="color: #1b2a4a;">${item.username}</strong>
            <span style="font-size: 12px; color: #94a3b8;">${item.time}</span>
          </div>
          <div style="color: #334155; font-size: 14px;">${item.memo}</div>
        </li>
      `).join('');
    }

    async function addMemo() {
      const username = document.getElementById('username').value.trim();
      const memo = document.getElementById('memo').value.trim();
      if (!username || !memo) return alert('성함과 내용을 모두 입력해 주세요.');

      await fetch('/memos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, memo })
      });

      document.getElementById('memo').value = '';
      loadMemos();
    }

    loadMemos();
  </script>
</body>
</html>
